<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Scroll Down Sports</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body {
        background: #0a0a0a;
        color: #f5f5f5;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 { font-size: 1.5rem; font-weight: 600; }
      p  { font-size: 0.9375rem; color: #a3a3a3; max-width: 28rem; line-height: 1.6; }
      button {
        margin-top: 0.5rem;
        padding: 0.625rem 1.25rem;
        border: none;
        border-radius: 0.5rem;
        background: #4f46e5;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      Check your connection and try again. Cached game data will appear
      automatically once you reconnect.
    </p>
    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
