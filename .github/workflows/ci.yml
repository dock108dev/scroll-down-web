# CI for scroll-down-web (Next.js / React / TypeScript)
#
# Covers:
#   • ESLint (eslint-config-next / core-web-vitals + TS)
#   • TypeScript (tsc --noEmit)
#   • Vitest unit tests + coverage artifact
#   • Next.js production build
#   • npm audit (production deps, high+ severity)
#   • Playwright @smoke E2E (Chromium; requires repo secrets — skipped on fork PRs)
#   • Docker image build + push to GHCR (main only)
#   • Dev deploy via SSH (main only, after docker)
#
# Related: CodeQL (.github/workflows/codeql.yml), Dependabot (.github/dependabot.yml),
#           daily full E2E (.github/workflows/e2e-daily.yml)

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the default GITHUB_TOKEN (jobs add scopes as needed).
permissions:
  contents: read
  actions: write # upload-artifact (coverage + Playwright report)

jobs:
  # ────────────────────────────────────────────────────────
  # Web — lint, typecheck, unit tests + coverage, audit, build
  # ────────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lockfile + install integrity are enforced by `npm ci` (fails on mismatch).

      - name: Audit production dependencies (high or critical)
        run: npm audit --omit=dev --audit-level=high
        # DevDependencies are still covered indirectly via Dependabot + local `npm audit`.

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest) + coverage
        run: npm run test:unit:coverage

      # Fork PRs get a read-only token — skip upload (tests still run).
      - name: Upload coverage report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ────────────────────────────────────────────────────────
  # Playwright — smoke E2E (requires secrets; not run for fork PRs)
  # ────────────────────────────────────────────────────────
  playwright-smoke:
    needs: web
    # Fork PRs do not receive repository secrets — skip instead of failing on empty API keys.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify sports API key is available to this job
        run: |
          if [ -z "${SPORTS_DATA_API_KEY:-}" ]; then
            echo "::error::SPORTS_DATA_API_KEY is empty. Add a repository Actions secret with that exact name, or grant this repo access if it is an organization secret."
            exit 1
          fi
          echo "SPORTS_DATA_API_KEY is set (length ${#SPORTS_DATA_API_KEY})"
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
          NEXT_PUBLIC_SCROLLDOWN_E2E: "1"
          MAGIC_LINK_SECRET: ${{ secrets.MAGIC_LINK_SECRET || 'scroll-down-ci-default-magic-link-secret-for-e2e-only-48chars' }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        # Exclude @live-upstream (real schedules / FairBet cards / golf payloads); daily E2E runs those.
        run: npx playwright test --grep "@smoke" --grep-invert "@live-upstream"
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
          NEXT_PUBLIC_SCROLLDOWN_E2E: "1"
          MAGIC_LINK_SECRET: ${{ secrets.MAGIC_LINK_SECRET || 'scroll-down-ci-default-magic-link-secret-for-e2e-only-48chars' }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: web/playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────────────
  # Docker — build + push image (main branch only)
  # ────────────────────────────────────────────────────────
  docker:
    needs: web
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          # NEXT_PUBLIC_* vars are inlined into the bundle at build time. Slot IDs
          # come from repo Variables so they can be set via the GitHub UI once the
          # AdSense ad units are created — no code change required.
          build-args: |
            NEXT_PUBLIC_ADS_ENABLED=true
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=ca-pub-3337164122582315
            NEXT_PUBLIC_ADSENSE_HOME_FEED_SLOT=${{ vars.NEXT_PUBLIC_ADSENSE_HOME_FEED_SLOT }}
            NEXT_PUBLIC_ADSENSE_GAME_DETAIL_SLOT=${{ vars.NEXT_PUBLIC_ADSENSE_GAME_DETAIL_SLOT }}
            NEXT_PUBLIC_ADSENSE_FAIRBET_SLOT=${{ vars.NEXT_PUBLIC_ADSENSE_FAIRBET_SLOT }}
            NEXT_PUBLIC_ADSENSE_BOTTOM_SLOT=${{ vars.NEXT_PUBLIC_ADSENSE_BOTTOM_SLOT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────
  # Deploy (dev) — pull + restart on Hetzner (after docker push)
  # ────────────────────────────────────────────────────────
  deploy-dev:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development

    steps:
      - name: Deploy to Hetzner (dev)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            DEPLOY_PATH="${{ vars.DEPLOY_PATH || '/opt/scrolldown-web-dev' }}"
            HOST_PORT="${{ vars.HOST_PORT || '3002' }}"
            export HOST_PORT
            cd "$DEPLOY_PATH"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}/web:latest
            docker compose up -d --no-deps --wait scrolldown-web
            docker image prune -f || true
